# ==========================================================
#  Grundeinstellungen der Webseite
#  Nach Änderungen an dieser Datei den lokalen Server neu starten.
# ==========================================================

title: Yannick Morgenthaler
description: Portfolio und Lebenslauf von Yannick Morgenthaler – Informatiker EFZ Systemtechnik
lang: de-CH
url: https://lastadmin.github.io
baseurl: ""

# Initialen, falls kein Foto vorhanden ist
initials: YM

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: sbquo,lsquo,bdquo,ldquo

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  # Abschnitte des Lebenslaufs (werden auf der Startseite angezeigt)
  lebenslauf:
    output: false
  # Projekte (erhalten je eine eigene Detailseite)
  projekte:
    output: true
    permalink: /projekte/:name/

defaults:
  - scope:
      path: ""
      type: projekte
    values:
      layout: project

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .DS_Store
